    <!-- Phaser CE sets window.Phaser and must run before the game module; vite.config.js swaps in the hashed file -->
    <script src="/phaser.js" defer vite-ignore></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Go Home Tanuki (You're Drunk)",
        "url": "https://tanuki.joekarlsson.com/",
        "description": "Fly a drunk tanuki home through the night. Made at Global Game Jam 2016 by Joe Karlsson, Kent Salcedo, Sarah Kurisu and Corina.",
        "author": { "@type": "Person", "name": "Joe Karlsson", "url": "https://www.joekarlsson.com/" },
        "genre": "Arcade",
        "playMode": "SinglePlayer",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "dateCreated": "2016-01"
      }
    </script>

    <style>
      :root {
        color-scheme: only dark;
        --background: #000033;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--background);
        overflow: hidden;
      }
      #game {
        display: flow-root;
        height: 100svh;
      }
      .poster {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100svh;
        object-fit: contain;
        pointer-events: none;
      }
      #game canvas {
        display: block;
        /* Shown with the first screen, once Phaser has scaled it to fit */
        visibility: hidden;
        touch-action: none;
      }
      /* Sound and full-screen buttons, bottom right over the letterbox */
      .page-controls {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 2;
        display: flex;
        gap: 8px;
      }
      .page-control:not([hidden]) {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.55);
        color: #ffffff;
        opacity: 0.7;
        cursor: pointer;
      }
      .page-control:hover,
      .page-control:focus-visible {
        opacity: 1;
      }
      .page-control:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 2px;
      }
      .sound-toggle .icon-sound-off,
      .sound-toggle.is-muted .icon-sound-on {
        display: none;
      }
      .sound-toggle.is-muted .icon-sound-off {
        display: block;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <main>
      <h1 class="visually-hidden">Go Home Tanuki (You're Drunk)</h1>
      <p class="visually-hidden">
        A one-button game. Click, tap or press the spacebar to flap and fly the tanuki home through the night.
        Collect sake to raise his drunkness and your score, and dodge the clouds and rocks.
      </p>
      <!-- Paints right away while Phaser loads; boot.js swaps it for the canvas once it's scaled -->
      <img class="poster" src="/images/splash/splash-main.webp" alt="" width="1024" height="768" fetchpriority="high" />
      <div id="game" role="application" aria-label="Go Home Tanuki game"></div>
      <div class="page-controls">
        <button class="page-control sound-toggle" type="button" aria-label="Turn sound off">
          <svg class="icon-sound-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
            <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
          <svg class="icon-sound-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
            <path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
        <button class="page-control fullscreen-toggle" type="button" aria-label="Full screen" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
      </div>
    </main>
    <script src="/analytics.js" defer></script>
    <script type="module" src="/src/js/game/app.js"></script>
  </body>
</html>
